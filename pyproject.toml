[project]
name = "thyra-data-quality"
version = "0.1.0"
description = "Thyra is a small QA project that shows how I tested a risk-based trading platform for the energy markets."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
pull = ["requests>=2.31"]
model = ["boto3>=1.34"]
figures = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["thyra"]
